name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'mobil/**'
              - 'ortak/veri/**'
            python:
              - 'k1-yapay-zeka/**'
              - 'k2-backend/**'
              - 'ortak/**'

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sözlük kopyası güncel mi
        run: python ortak/araclar/sozluk_esitle.py --kontrol
      - name: K1 testleri (TensorFlow olmadan, sadece veri işleme)
        run: |
          pip install numpy pytest
          pip install -e k1-yapay-zeka --no-deps
          pytest k1-yapay-zeka/tests
      - name: K2 testleri (demo modunda)
        working-directory: k2-backend
        run: |
          pip install -r requirements-dev.txt
          pytest
